name: Migration Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/spaces/backend/**'

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # Install from uv.lock; `uv pip install` ignores it and re-resolves.
        env:
          UV_HTTP_TIMEOUT: "600"
          UV_PYTHON: "3.12"
          UV_NO_MANAGED_PYTHON: "1"
        run: |
          cd packages/spaces/backend
          uv sync --locked

      - name: Check for multiple heads
        run: |
          cd packages/spaces/backend
          just check

      - name: Test fresh install
        run: |
          cd packages/spaces/backend
          rm -f /tmp/ci_test.db
          SYFT_SQLITE_DB_PATH=/tmp/ci_test.db just upgrade
          echo "Fresh install migration succeeded"
