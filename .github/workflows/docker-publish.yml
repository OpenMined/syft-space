# Builds the Syft Space image and pushes it as :<short commit id> and :latest.
# A build from main then adds its entry to packages/spaces/CHANGELOG.md.
name: Build and Push Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHANGELOG_URL: https://github.com/${{ github.repository }}/blob/main/packages/spaces/CHANGELOG.md

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.build.outputs.digest }}
      digest-arm64: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --cwd packages/spaces/frontend

      - name: Build frontend
        run: bun run --cwd packages/spaces/frontend build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform suffix
        id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "suffix=${platform#linux/}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }}-${{ steps.platform.outputs.suffix }}
          labels: |
            org.opencontainers.image.documentation=${{ env.CHANGELOG_URL }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./packages/spaces
          file: ./packages/spaces/Dockerfile
          target: production
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            PYTHON_VERSION=3.12

  manifest:
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.sha.outputs.short }}
      previous: ${{ steps.previous.outputs.revision }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Read before :latest is replaced. The commit is an annotation on the
      # index, or on older images a label in the per-arch image config.
      - name: Find the commit the current latest image was built from
        id: previous
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="${IMAGE,,}"
          KEY="org.opencontainers.image.revision"
          find_revision() {
            jq -r --arg key "$KEY" \
              '[.. | objects | select(has($key)) | .[$key]] | first // empty'
          }

          revision=$(docker buildx imagetools inspect --raw "${IMAGE}:latest" | find_revision || true)
          if [ -z "$revision" ]; then
            revision=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Image}}' | find_revision || true)
          fi
          echo "Previous image was built from: ${revision:-unknown}"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="${IMAGE,,}"  # Convert to lowercase
          SHA="${{ steps.sha.outputs.short }}"

          # Annotations go on the index: the registry shows those for a
          # multi-arch tag, not the labels of the per-arch images.
          docker buildx imagetools create \
            -t "${IMAGE}:${SHA}" \
            -t "${IMAGE}:latest" \
            --annotation "index:org.opencontainers.image.description=Syft Space: publish datasets and models as endpoints on SyftHub." \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.documentation=${{ env.CHANGELOG_URL }}" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"

  # Runs last, so only an image that was pushed gets an entry.
  changelog:
    timeout-minutes: 10
    needs: manifest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # One at a time, so two builds can't race the changelog commit.
    concurrency:
      group: space-image-changelog
      cancel-in-progress: false
    env:
      # A token of a user with a Copilot seat; unset means no rewording.
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

    steps:
      # Full history of main as it is now: the entry lists the changes
      # between the previous image's commit and this one. Without a previous
      # commit from the registry, the newest changelog entry is used.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # What the entry will list, as text for the model. Rewording is
      # skipped when nothing is listed or no Copilot token is configured.
      - name: Collect the changes in this image
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/space_changelog.py "${{ needs.manifest.outputs.tag }}" \
            --since "${{ needs.manifest.outputs.previous }}" \
            --facts "${RUNNER_TEMP}/changes.txt"
          if [ -s "${RUNNER_TEMP}/changes.txt" ] && [ -n "${COPILOT_GITHUB_TOKEN}" ]; then
            echo "reword=true" >> "$GITHUB_OUTPUT"
          fi

      # Optional: a failure here leaves the entry with the PR titles.
      - name: Install the Copilot CLI
        if: steps.changes.outputs.reword == 'true'
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Reword the changes with Copilot
        id: reword
        if: steps.changes.outputs.reword == 'true'
        continue-on-error: true
        uses: actions/ai-inference@v3
        with:
          system-prompt-file: .github/prompts/space_changelog.txt
          prompt-file: ${{ runner.temp }}/changes.txt
          model: gpt-4.1

      - name: Add the changelog entry and push it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/space_changelog.py "${{ needs.manifest.outputs.tag }}" \
            --since "${{ needs.manifest.outputs.previous }}" \
            --wording "${{ steps.reword.outputs.response-file }}"
          if git diff --quiet -- packages/spaces/CHANGELOG.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/spaces/CHANGELOG.md
          git commit -m "docs(spaces): changelog for image ${{ needs.manifest.outputs.tag }}"
          git push origin HEAD:main
