name: Space changelog wording
description: >-
  Asks Copilot to reword the changes in a Syft Space image, one sentence per
  pull request. Never fails the job: without an answer, the changelog script
  uses the pull request titles.

inputs:
  tag:
    description: Tag of the image, its short commit id
    required: true
  since:
    description: Commit the previous image was built from
    required: false
    default: ""

outputs:
  response-file:
    description: File holding Copilot's answer; empty if it was not asked
    value: ${{ steps.reword.outputs.response-file }}
  outcome:
    description: success, failure, or skipped when there was nothing to reword
    value: ${{ steps.reword.outcome || 'skipped' }}

runs:
  using: composite
  steps:
    # What the entry will list, as text for the model.
    - name: Collect the changes in this image
      id: changes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 .github/scripts/space_changelog.py "${{ inputs.tag }}" \
          --since "${{ inputs.since }}" \
          --facts "${RUNNER_TEMP}/changes.txt"
        if [ -s "${RUNNER_TEMP}/changes.txt" ]; then
          echo "reword=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install the Copilot CLI
      if: steps.changes.outputs.reword == 'true'
      continue-on-error: true
      shell: bash
      run: npm install -g @github/copilot

    # Uses the job's own token, which needs `copilot-requests: write`. Fails
    # if the organisation's Copilot CLI policy is off.
    - name: Reword the changes with Copilot
      id: reword
      if: steps.changes.outputs.reword == 'true'
      continue-on-error: true
      uses: actions/ai-inference@v3
      with:
        system-prompt-file: .github/prompts/space_changelog.txt
        prompt-file: ${{ runner.temp }}/changes.txt
        model: gpt-4.1
      env:
        GITHUB_TOKEN: ${{ github.token }}
