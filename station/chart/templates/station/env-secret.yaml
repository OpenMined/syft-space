{{- if and .Values.station.enabled (not .Values.station.existingEnvSecret) }}
{{/*
Session secret preservation: an explicit value wins; otherwise reuse the one
already stored (so `helm upgrade` doesn't invalidate live cookies); only on a
truly fresh install do we generate a new random secret.
*/}}
{{- $secretName := printf "%s-env" (include "syft-station.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $session := .Values.station.sessionSecret -}}
{{- if not $session -}}
{{- if and $existing $existing.data (index $existing.data "SYFT_STATION_SESSION_SECRET") -}}
{{- $session = index $existing.data "SYFT_STATION_SESSION_SECRET" | b64dec -}}
{{- else -}}
{{- $session = randAlphaNum 64 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "syft-station.labels" . | nindent 4 }}
    app.kubernetes.io/component: station
type: Opaque
stringData:
  SYFT_STATION_SESSION_SECRET: {{ $session | quote }}
{{- end }}
