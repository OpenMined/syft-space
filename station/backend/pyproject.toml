[project]
name = "syft-station"
version = "0.1.0"
description = "Station control plane — provisions and manages syft-space instances on Kubernetes"
authors = [
    {name = "OpenMined", email = "info@openmined.org"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "loguru>=0.7.2",
    "typer>=0.15",
    "kubernetes>=31.0",
    "pyyaml>=6.0",
]

[project.scripts]
syft-station = "syft_station.cli:app"

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.8",
]
dev = [
    "syft-station[test,lint]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["syft_station"]
# Built frontend is gitignored but must ship in the wheel (CI builds it
# into syft_station/ui before the wheel build).
artifacts = ["syft_station/ui/**", "syft_station/k8s/**"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults (FastAPI Depends is fine)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
