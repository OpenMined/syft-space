# Per-space Secret — holds the space's admin API key (SYFT_ADMIN_API_KEY).
# Rendered by syft_station.components.provision.manifests (placeholders filled in).
apiVersion: v1
kind: Secret
metadata:
  name: ${RESOURCE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: syft-space
    app.kubernetes.io/managed-by: syft-station
    syftcluster.openmined.org/space: "${SUBDOMAIN}"
type: Opaque
stringData:
  SYFT_ADMIN_API_KEY: "${ADMIN_TOKEN}"
