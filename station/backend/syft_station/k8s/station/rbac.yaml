# Station identity + least-privilege access to manage spaces.
#
# The station runs in-cluster under this ServiceAccount (kube.py detects
# KUBERNETES_SERVICE_HOST and uses it automatically). The Role grants only
# what K8sProvisioner actually calls, scoped to the spaces namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: syft-station
  namespace: syft-spaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: syft-station
  namespace: syft-spaces
rules:
  # Per-space bundle: Secret, PVC, Deployment, Service, Ingress
  - apiGroups: [""]
    resources: [secrets, services, persistentvolumeclaims]
    verbs: [get, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch, delete]
  # Live status derivation and pause/resume (scale to 0/1)
  - apiGroups: [apps]
    resources: [deployments/status]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: syft-station
  namespace: syft-spaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: syft-station
subjects:
  - kind: ServiceAccount
    name: syft-station
    namespace: syft-spaces
