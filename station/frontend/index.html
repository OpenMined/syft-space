<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syft Station</title>
    <!-- Set the OMDS page theme before first paint (no flash). Mirrors the
         localStorage key + 'system' fallback in src/composables/useTheme.ts. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          var dark =
            t === 'dark' ||
            ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.setAttribute('data-theme', 'dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
