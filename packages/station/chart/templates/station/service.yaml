{{- if .Values.station.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "syft-station.fullname" . }}
  labels:
    {{- include "syft-station.labels" . | nindent 4 }}
    app.kubernetes.io/component: station
spec:
  selector:
    {{- include "syft-station.selectorLabels" (dict "ctx" . "component" "station") | nindent 4 }}
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
{{- end }}
