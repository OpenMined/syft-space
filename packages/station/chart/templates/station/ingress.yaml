{{- if and .Values.station.enabled .Values.station.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "syft-station.fullname" . }}
  labels:
    {{- include "syft-station.labels" . | nindent 4 }}
    app.kubernetes.io/component: station
  {{- with .Values.station.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.station.ingress.className }}
  {{- if .Values.station.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.station.ingress.host | quote }}
      secretName: {{ .Values.station.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.station.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "syft-station.fullname" . }}
                port:
                  number: 8090
{{- end }}
