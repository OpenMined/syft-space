{{- if and .Values.chromadb.enabled .Values.chromadb.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.chromadb.service.name }}-data
  labels:
    {{- include "syft-station.labels" . | nindent 4 }}
    app.kubernetes.io/component: chromadb
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.chromadb.persistence.size | quote }}
  {{- with .Values.chromadb.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
