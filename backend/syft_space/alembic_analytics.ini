# Alembic configuration for the analytics database (analytics.db).
# Separate from the main alembic.ini to keep analytics schema isolated.

[alembic]
# path to migration scripts
script_location = %(here)s/alembic_analytics

# Database URL is configured in alembic_analytics/env.py
# It will be loaded from backend.config.app_settings at runtime

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .
path_separator = os

version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
