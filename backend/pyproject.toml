[project]
name = "syai-server"
version = "0.1.0"
description = "Syft AI Server Backend API"
authors = [
    {name = "OpenMined", email = "support@openmined.org"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.116.2",
    "uvicorn[standard]==0.35.0",
    "pydantic[email]==2.11.9",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.14",
    "loguru>=0.7.3",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "mypy>=0.950"
]

libs = [
    "weaviate-client>=4.17.0",
    "docling>=2.55.0",
]


[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
