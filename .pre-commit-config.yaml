repos:
  # Ruff - Fast Python linter and formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        files: ^backend/
      # Run the formatter
      - id: ruff-format
        files: ^backend/

  # # mypy - Static type checking
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies:
  #         - types-requests
  #         - sqlmodel
  #         - pydantic
  #       args: [--ignore-missing-imports]
  #       files: ^backend/

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates are Go-templated, not valid YAML.
        exclude: ^station/chart/templates/
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, backend/pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        files: ^backend/

  # Conventional Commits — validates commit subject lines.
  # Requires opt-in: `pre-commit install --hook-type commit-msg`
  # (the default `pre-commit install` only wires the pre-commit stage).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - chore
          - refactor
          - perf
          - docs
          - test
          - ci
          - build
          - style
          - revert

# Install both git-hook stages on `pre-commit install` (no `--hook-type` needed).
default_install_hook_types: [pre-commit, commit-msg]

# Configuration for pre-commit
default_language_version:
  python: python3.12

# Run pre-commit on all files or just staged files
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
